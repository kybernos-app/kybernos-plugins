<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="utf-8">
<title>dsh-mermaid — banc d'essai</title>
<style>
  /* Jetons DSH réalistes : le plugin ne doit lire QUE ceux-ci. */
  :root{
    --dsw-font-family: ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --dsw-alias-bg-base:#0e1117;
    --dsw-alias-bg-layer-1:#141a22;
    --dsw-alias-bg-layer-2:#101620;
    --dsw-alias-label-primary:#e7eef6;
    --dsw-alias-label-secondary:#93a2b4;
    --dsw-alias-border-l1:#1d2530;
    --dsw-alias-border-l2:#26303d;
    --dsw-alias-brand-primary:#58a6ff;
    --dsw-alias-state-error-primary:#f85149;
    --dsw-alias-interactive-bg-hover:#1b2431;
  }
  body{margin:0;padding:24px;background:var(--dsw-alias-bg-base);color:var(--dsw-alias-label-primary);
    font-family:var(--dsw-font-family)}
  h1{font-size:14px;color:var(--dsw-alias-label-secondary);font-weight:500}
  .wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
  /* Reproduction du CSS CodeBlock utile au banc d'essai. */
  .md-code-block{border:1px solid var(--dsw-alias-border-l2);border-radius:12px;overflow:hidden;
    background:var(--dsw-alias-bg-layer-1)}
  .md-code-block pre{margin:0;padding:8px 12px;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
    white-space:pre;overflow-x:auto}
  [data-code-block-banner]{display:flex;justify-content:space-between;align-items:center;
    padding:2px 8px;background:var(--dsw-alias-bg-layer-2);font-size:11px;color:var(--dsw-alias-label-secondary)}
  [data-code-block-banner] button{font:inherit;background:transparent;border:0;color:inherit;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <h1>DOM fidèle à <code>CodeBlock</code> (primitives lib/index.js:7590-7613)</h1>

  <!-- 1. fence ```mermaid valide -->
  <div class="md-code-block md-block" id="valid">
    <div class="bannerWrap"><div data-code-block-banner>
      <div class="infostring">mermaid</div>
      <div class="action"><button class="copyButton">Copier</button></div>
    </div></div>
    <pre class="plain"><code>flowchart TD
  A[Question] --&gt; B{Un diagramme ?}
  B -- Oui --&gt; C[Mermaid]
  B -- Non --&gt; D[Tableau ou graphe]
  C --&gt; E[Rendu SVG]
  D --&gt; E</code></pre>
  </div>

  <!-- 2. fence ```mermaid invalide -->
  <div class="md-code-block md-block" id="invalid">
    <div class="bannerWrap"><div data-code-block-banner>
      <div class="infostring">mermaid</div>
      <div class="action"><button class="copyButton">Copier</button></div>
    </div></div>
    <pre class="plain"><code>flowchart TD
  A[ --&gt; ???</code></pre>
  </div>

  <!-- 3. fence d'un autre langage : ne doit PAS être touchée -->
  <div class="md-code-block md-block" id="not-mermaid">
    <div class="bannerWrap"><div data-code-block-banner>
      <div class="infostring">python</div>
      <div class="action"><button class="copyButton">Copier</button></div>
    </div></div>
    <pre class="plain"><code>def bonjour():
    return "mermaid-non-touche"</code></pre>
  </div>
</div>

<script>
  // Chargeur de modules DSH simulé : même contrat que le vrai
  // (window.__ModuleLoader__.load({ id, factory })).
  window.__ModuleLoader__ = {
    load({ id, factory }) {
      const exports = factory(() => { throw new Error('require indisponible dans le banc d\'essai') })
      window.__PLUGIN__ = { id, exports }
      if (exports && typeof exports.apply === 'function') exports.apply({})
    }
  }
</script>
<script src="../client/client.js"></script>
</body>
</html>
