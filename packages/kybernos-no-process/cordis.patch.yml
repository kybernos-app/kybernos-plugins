# dsh bundle patch: on a host that cannot create processes, the engine's subprocess and sandbox providers are replaced by in-process ones.
- id: subprocess
  disabled: true
- id: sandbox
  disabled: true
- insert:
    - id: subprocess-inproc
      name: '@local/kybernos-no-process'
    - id: sandbox-inproc
      name: '@local/kybernos-no-process/sandbox'
    - id: inproc-mcp-door
      name: '@local/kybernos-no-process/mcp-door'
