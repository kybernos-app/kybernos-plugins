<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font-family: system-ui, sans-serif; line-height: 1.5; }
  main { max-width: 42rem; margin: 0 auto; padding: 4rem 1.25rem; }
  h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); line-height: 1.15; margin: 0 0 .75rem; }
  p { margin: .5rem 0; opacity: .85; }
  .cta { display: inline-block; margin-top: 1.25rem; padding: .7rem 1.25rem; border-radius: .6rem; background: #2563eb; color: #fff; text-decoration: none; font-weight: 600; }
  @media (prefers-color-scheme: dark) { .cta { background: #3b82f6; } }
</style>
</head>
<body>
<main>
  <h1>Your landing page</h1>
  <p>This page is served by a tiny static server — no database, no runtime beyond it.</p>
  <p>Edit <code>public/index.html</code>, or ask the chat to reshape it.</p>
  <a class="cta" href="#">Get started</a>
</main>
</body>
</html>
