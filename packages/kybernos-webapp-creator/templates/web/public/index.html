<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My app</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; font-family: system-ui, sans-serif; line-height: 1.5; }
  main { max-width: 42rem; margin: 0 auto; padding: 3rem 1.25rem; }
  h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); margin: 0 0 .5rem; }
  .status { display: inline-flex; gap: .5rem; align-items: center; padding: .45rem .8rem; border-radius: .6rem; border: 1px solid rgba(127,127,127,.35); font-size: .95rem; }
  .dot { width: .55rem; height: .55rem; border-radius: 50%; background: #9ca3af; }
  .dot.ok { background: #16a34a; }
  code { font-size: .9em; }
</style>
</head>
<body>
<main>
  <h1>My app</h1>
  <p>The shell is live. The admin UI, auth and the mini base views arrive with the foundation batch.</p>
  <p class="status"><span class="dot" id="dot"></span><span id="status">checking the API…</span></p>
  <p>Edit <code>public/index.html</code> for the pages, <code>api.js</code> for the routes.</p>
</main>
<script>
  fetch('/api/health').then((r) => r.json()).then((d) => {
    document.getElementById('dot').className = 'dot ok'
    document.getElementById('status').textContent = 'API ok — stack ' + d.stack + ', base: ' + (d.base.present ? d.base.tables + ' tables' : 'not created yet')
  }).catch(() => {
    document.getElementById('status').textContent = 'API unreachable'
  })
</script>
</body>
</html>
