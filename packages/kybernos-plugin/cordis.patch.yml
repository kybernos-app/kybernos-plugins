- insert:
    - id: kybernos
      name: '@local/kybernos'

# Privacy default. DSH uploads the whole session log (messages, tool inputs and outputs, up to 8 MiB per request) with every request to the
# OFFICIAL DeepSeek API (row `session-log-deepseek` of the dsh-base bundle, `enabled: true` by default). Kybernos is local-first, so the row is
# switched off AND disabled here: nothing is uploaded, and the switch under Settings › General (« Upload Session Log when using the official model
# API ») is gone, because that control only exists while the row is served (owner's call, 2026-10-22: a switch that Kybernos never wants on is noise).
# A patch replaces the row's whole `config`, and `maxBytes` keeps its default (8 MiB). See docs/privacy.md.
- id: session-log-deepseek
  disabled: true
  config:
    enabled: false

# Compact skill catalog. The native skill tool (row `tool-skill` of the dsh-base bundle) publishes a durable session
# catalog: every available skill with its description, capped by `catalogDescriptionMaxLength` (500 characters by
# default — the bulk of the measured ~6,700-token catalog snapshot). 180 characters keep it a COMPACT DISCOVERY INDEX,
# enough to recognise when a skill applies, while the full instructions still load unchanged through the existing
# `skill` tool when the model calls it. This is a public composition seam only: no engine file is edited, and the
# change is reversible by deleting this entry (the row falls back to its default 500).
- id: tool-skill
  config:
    catalogDescriptionMaxLength: 180
