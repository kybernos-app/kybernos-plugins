<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio Exemple — notre kyber maquette</title>
<style>
  body{margin:0;font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#20222a;background:#fafafa}
  header{background:#101216;color:#fff;padding:22px 28px;font-weight:700;letter-spacing:.3px}
  main{max-width:640px;margin:48px auto;padding:0 24px}
  h1{font-size:26px} p{color:#4a4e57}
</style>
</head>
<body>
<header>Studio Exemple</header>
<main>
  <h1>Parlez à notre équipe maquette</h1>
  <p>Cette page simule le site d'un client. Le widget Kybernos est intégré
     par une seule ligne — le même embed que produit l'onglet Widget de la fiche.
     La bulle attend en bas à gauche.</p>
  <p>Cliquez : conditions d'utilisation → compte Kybernos → discussion.</p>
</main>
<!-- Boucle réelle cross-origin : le script et la configuration viennent de
     l'origine DSH (comme un vrai site client), la page est servie ailleurs.
     La config publiée (POST par la fiche, lue par le chargeur) doit gagner sur
     les attributs : couleur #7C3AED, position left, titre « Porte maquette ». -->
<script src="http://127.0.0.1:3080/kybernos/widget.js"
        data-team="widget"
        data-api="http://127.0.0.1:3080/kybernos/widget/api"
        data-color="#2F6B54"
        data-position="right"
        data-terms-url="https://exemple.fr/cgu"
        data-privacy-url="https://exemple.fr/confidentialite"
        data-footer="Propulsé par Kybernos"
        ></script>
</body>
</html>
