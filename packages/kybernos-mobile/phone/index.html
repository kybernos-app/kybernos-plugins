<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141416">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="/__kb/manifest.webmanifest">
<link rel="apple-touch-icon" href="/__kb/icon-180.png">
<title>Kybernos</title>
<style>
:root { color-scheme: dark; }
html, body { margin: 0; height: 100%; background: #141416; color: #f3f3f5; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
#gate { position: fixed; inset: 0; box-sizing: border-box; padding: max(56px, env(safe-area-inset-top)) 24px max(32px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; background: #141416; z-index: 2; overflow-y: auto; }
#gate[hidden] { display: none; }
.brand { display: flex; align-items: center; gap: 12px; font-weight: 650; font-size: 17px; }
.mark { width: 36px; height: 36px; border-radius: 10px; display: block; }
h1 { margin: 48px 0 0; font-size: 26px; font-weight: 650; line-height: 1.2; }
p { margin: 10px 0 0; color: #a1a1ab; font-size: 16px; line-height: 1.45; }
#sas { margin-top: 36px; padding: 24px; border: 1px solid #2e2e34; border-radius: 16px; background: #1b1b1f; text-align: center; }
#sas[hidden] { display: none; }
#sas small { display: block; color: #a1a1ab; font-size: 14px; }
#sas b { display: block; margin-top: 10px; font-size: 48px; letter-spacing: .2em; padding-left: .2em; font-variant-numeric: tabular-nums; }
#actions { margin-top: auto; padding-top: 20px; display: flex; flex-direction: column; gap: 10px; }
#actions button { min-height: 48px; border-radius: 12px; border: 1px solid #2e2e34; background: #232328; color: #f3f3f5; font: inherit; font-weight: 600; }
#actions button.primary { background: #f04437; border-color: #f04437; color: #fff; }
#apps { margin-top: 28px; display: flex; flex-direction: column; gap: 12px; }
#apps[hidden], #steps[hidden], #pasteBox[hidden] { display: none; }
.app { display: grid; grid-template-columns: 48px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px; border: 1px solid #2e2e34; border-radius: 14px; background: #1b1b1f; }
.app img { width: 48px; height: 48px; border-radius: 12px; display: block; }
.app b { display: block; font-size: 16px; font-weight: 650; }
.app span { display: block; color: #a1a1ab; font-size: 13px; line-height: 1.35; }
.app button { min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid #2e2e34; background: #232328; color: #f3f3f5; font: inherit; font-weight: 600; }
.app button.primary { background: #f04437; border-color: #f04437; color: #fff; }
.app .done { color: #86e0a3; font-size: 13px; font-weight: 600; }
#steps { margin: 20px 0 0; padding-left: 22px; color: #a1a1ab; font-size: 15px; line-height: 1.5; }
#steps li + li { margin-top: 8px; }
#steps b { color: #f3f3f5; }
#pasteBox { margin-top: 20px; min-height: 48px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; border: 1px solid #2e2e34; background: #1b1b1f; color: #f3f3f5; font: inherit; font-size: 16px; }
#lock { margin-top: 24px; display: flex; gap: 10px; color: #a1a1ab; font-size: 14px; }
#veil { position: fixed; left: 0; right: 0; top: 0; z-index: 3; padding: 10px 16px; background: #f5b942; color: #141416; font-size: 14px; font-weight: 600; text-align: center; }
#veil[hidden] { display: none; }
#app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #0b0b0d; }
#app[hidden] { display: none; }
</style>
</head>
<body data-state="start" data-app="remote">
<div id="veil" hidden></div>
<iframe id="app" hidden title="Kybernos"></iframe>
<main id="gate">
  <div class="brand"><img class="mark" src="/__kb/icon-192.png" alt=""><div>Kybernos</div></div>
  <h1 id="title"></h1>
  <p id="sub"></p>
  <div id="apps" hidden></div>
  <ol id="steps" hidden></ol>
  <div id="sas" hidden><small id="saslabel"></small><b id="sasnum"></b></div>
  <input id="pasteBox" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" hidden>
  <div id="lock"><span id="locktext"></span></div>
  <div id="actions"></div>
</main>
<script type="module" src="/__kb/phone.mjs"></script>
</body>
</html>
