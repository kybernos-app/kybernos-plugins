<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kybernos — la carte</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2308151b'/%3E%3Cpath d='M11 8.4v15.2M13.7 15.55L21.2 8.4M13.7 16.45L21.2 23.6' stroke='%234fe3c1' stroke-width='2.4' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0a0e13; --panel:#111822; --panel-2:#0e141c; --line:#22303f;
  --ink:#e8eef7; --ink-2:#9fb0c6; --ink-3:#6c7f95;
  --teal:#4fe3c1; --violet:#a78bfa; --amber:#fbbf24; --blue:#67b8ff; --rose:#fb7185; --slate:#8fa3ba;
  --shadow:0 18px 50px rgba(0,0,0,.45);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
body[data-theme="light"]{
  --bg:#f3f6fa; --panel:#ffffff; --panel-2:#f7f9fc; --line:#d8e1ec;
  --ink:#0d1723; --ink-2:#4c5f76; --ink-3:#7b8da4;
  --teal:#0e9f86; --violet:#6d4bd8; --amber:#b06a00; --blue:#1f6fd0; --rose:#c2384c; --slate:#5b6f86;
  --shadow:0 18px 44px rgba(16,32,52,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(1100px 600px at 12% -10%, color-mix(in srgb, var(--teal) 9%, transparent), transparent 60%),
    radial-gradient(900px 500px at 88% -15%, color-mix(in srgb, var(--violet) 10%, transparent), transparent 60%),
    var(--bg);
  color:var(--ink); font:13px/1.45 var(--sans); overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}

header{
  position:fixed;inset:0 0 auto 0;height:58px;z-index:40;display:flex;align-items:center;gap:14px;padding:0 18px;
  background:color-mix(in srgb, var(--bg) 82%, transparent);border-bottom:1px solid var(--line);backdrop-filter:blur(14px);
}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mark{width:27px;height:27px;flex:none}
.brand .mark svg{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
.brand h1{font-size:14px;font-weight:650;letter-spacing:-.01em;white-space:nowrap}
.brand p{font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .spacer{flex:1}
.hbtn{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:9px;
  border:1px solid var(--line);color:var(--ink-2);font-size:11.5px;background:var(--panel-2)}
.hbtn:hover{color:var(--ink);border-color:color-mix(in srgb,var(--ink-2) 40%, transparent)}
.hbtn[aria-pressed="true"]{color:var(--ink);border-color:color-mix(in srgb,var(--teal) 55%, transparent);
  background:color-mix(in srgb,var(--teal) 12%, var(--panel-2))}
.hbtn svg{width:14px;height:14px}
#railBtn{display:none}

#app{display:flex;height:100vh;height:100dvh;overflow:hidden}

#rail{width:286px;flex:none;margin-top:58px;height:calc(100% - 58px);border-right:1px solid var(--line);
  background:color-mix(in srgb,var(--panel) 55%, transparent);display:flex;flex-direction:column;overflow:hidden}
#rail .rh{padding:14px 16px 8px;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
#rail .list{overflow:auto;padding:0 10px 8px;display:flex;flex-direction:column;gap:3px;scrollbar-width:thin}
.pill{display:flex;gap:9px;align-items:flex-start;text-align:left;width:100%;padding:8px 9px;
  border-radius:11px;border:1px solid transparent;color:var(--ink-2);line-height:1.3}
.pill:hover{background:var(--panel-2);color:var(--ink)}
.pill[aria-current="true"]{background:color-mix(in srgb,var(--teal) 11%, var(--panel));
  border-color:color-mix(in srgb,var(--teal) 42%, transparent);color:var(--ink)}
.pill .num{width:18px;flex:none;font:10.5px/1.5 var(--mono);color:var(--ink-3);padding-top:1px}
.pill[aria-current="true"] .num{color:var(--teal)}
.pill .tt{font-size:11.8px;font-weight:560;display:block}
.pill .pitch{display:block;font-size:10.4px;color:var(--ink-3);margin-top:2px;font-weight:400}
.pill .wit{display:inline-block;margin-top:4px;font-size:9px;letter-spacing:.04em;text-transform:uppercase;
  color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 40%, transparent);padding:0 6px;border-radius:99px}
#rail .steps[hidden]{display:none}
#rail .steps{display:flex;flex-direction:column;gap:1px;margin:1px 6px 5px 27px;padding-left:9px;
  border-left:1px solid color-mix(in srgb,var(--teal) 40%, transparent)}
#rail .step{text-align:left;font-size:10.4px;line-height:1.3;color:var(--ink-3);padding:3px 5px;border-radius:6px}
#rail .step b{font-weight:600;color:var(--ink-2)}
#rail .step:hover{background:var(--panel-2);color:var(--ink-2)}
#rail .step[aria-current="true"]{background:color-mix(in srgb,var(--teal) 13%, transparent);color:var(--ink)}
#rail .step[aria-current="true"] b{color:var(--ink)}
#rail .legend{padding:9px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:5px}
#rail .legend b{font-size:9.6px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
.lg{display:flex;align-items:center;gap:8px;font-size:10.8px;color:var(--ink-2)}
.lg i{width:22px;height:0;border-top:2px solid;flex:none;border-radius:2px}
#rail .foot{padding:8px 16px 12px;font-size:10.3px;color:var(--ink-3);line-height:1.5}
#rail .foot code{font:9.8px var(--mono);color:var(--ink-2)}

#stage{position:relative;flex:1;margin-top:58px;height:calc(100% - 58px);
  display:flex;flex-direction:column;overflow:hidden;min-width:0}
#scroll{flex:1;overflow:hidden;padding:10px 8px 0;display:flex;justify-content:center;align-items:center}
#canvas{position:relative;width:1120px;flex:none;transform-origin:top center;padding-bottom:8px}

.zone{position:absolute;border:1px solid var(--line);border-radius:18px;
  background:linear-gradient(180deg, color-mix(in srgb,var(--panel) 94%, transparent), color-mix(in srgb,var(--panel-2) 94%, transparent));
  box-shadow:0 1px 0 color-mix(in srgb,var(--ink) 4%, transparent) inset;
  display:flex;flex-direction:column;overflow:hidden}
.zone::before{content:"";position:absolute;inset:0;border-radius:18px;pointer-events:none;
  background:radial-gradient(420px 180px at 50% -40%, color-mix(in srgb, var(--zt) 15%, transparent), transparent 70%)}
.zone[data-tone="teal"]{--zt:var(--teal)} .zone[data-tone="violet"]{--zt:var(--violet)}
.zone[data-tone="amber"]{--zt:var(--amber)} .zone[data-tone="blue"]{--zt:var(--blue)}
.zone[data-tone="rose"]{--zt:var(--rose)}
.zone>.zh{position:relative;padding:12px 14px 4px;flex:none}
.zone .zh h2{font-size:11.6px;font-weight:650;letter-spacing:-.005em;display:flex;align-items:center;gap:8px}
.zone .zh h2::before{content:"";width:7px;height:7px;border-radius:2px;background:var(--zt);flex:none;
  box-shadow:0 0 10px color-mix(in srgb,var(--zt) 70%, transparent)}
.zone .zh p{font-size:10.2px;color:var(--ink-3);margin-left:15px}
.zone>.zb{position:relative;padding:5px 10px 0;display:flex;flex-direction:column;gap:7px;flex:1;overflow:hidden}
.zone.row>.zb{flex-direction:row;gap:9px;align-items:stretch}
.zone.row>.zb .node{flex:1;min-width:0}
.zone>.zn{position:relative;flex:none;margin:7px 14px 10px;font-size:9.7px;line-height:1.4;color:var(--ink-3);
  border-top:1px dashed color-mix(in srgb,var(--line) 80%, transparent);padding-top:6px}

.node{position:relative;width:100%;text-align:left;border-radius:12px;border:1px solid var(--line);
  background:color-mix(in srgb,var(--panel) 88%, var(--bg));padding:7px 9px 7px 34px;
  transition:opacity .25s, transform .25s, border-color .2s, box-shadow .25s, filter .25s; --nt:var(--slate)}

/* la couleur est réservée aux flux : une carte reste neutre, la zone porte son teint */
.node:hover{border-color:color-mix(in srgb,var(--nt) 55%, var(--line));transform:translateY(-1px);z-index:2}
.node .nt{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:-.005em;line-height:1.25}
.node .ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-3);display:inline-flex;transition:color .2s}
.node .ico svg{width:100%;height:100%;display:block}
.node:hover .ico{color:var(--ink-2)}
.node[data-live] .ico{color:var(--ink)}
.node .nt .tag{margin-left:auto;flex:none;font-size:8.3px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);
  border:1px solid var(--line);border-radius:99px;padding:0 5px;line-height:1.55;font-weight:500}
.node .ns{display:block;font-size:10.3px;color:var(--ink-2);margin-top:1px;line-height:1.3}
.node .nb{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.node .badge{font-size:8.6px;letter-spacing:.02em;border-radius:99px;padding:0 5px;line-height:1.6;
  color:var(--amber);border:1px solid color-mix(in srgb,var(--amber) 45%, transparent);
  background:color-mix(in srgb,var(--amber) 10%, transparent)}
.node[data-hero="1"]{padding:9px 10px 9px 38px}
.node[data-hero="1"] .nt{font-size:13.2px}
.node[data-hero="1"] .ns{font-size:10.8px}
.node[data-dim]{opacity:.33;filter:saturate(.35)}
.node[data-on]{border-color:color-mix(in srgb,var(--nt) 50%, var(--line))}
.node[data-live]{background:color-mix(in srgb,var(--nt) 13%, var(--panel));
  box-shadow:0 0 0 1.5px color-mix(in srgb,var(--nt) 62%, transparent), 0 0 26px -10px color-mix(in srgb,var(--nt) 85%, transparent)}

#wires{position:absolute;inset:0;width:1120px;height:782px;pointer-events:none;overflow:visible;z-index:9}
#wires path{fill:none;stroke-linecap:round;transition:opacity .25s, stroke-width .2s}
#wires path[data-kind="local"]{stroke:var(--teal)} #wires path[data-kind="server"]{stroke:var(--violet)}
#wires path[data-kind="e2e"]{stroke:var(--blue)} #wires path[data-kind="ext"]{stroke:var(--amber)}
#wires path[data-kind="hook"]{stroke:var(--rose)}
#wires path.base{opacity:.42;stroke-width:1.1;stroke-dasharray:2 5}
#app[data-scen="1"] #wires path.base{opacity:.09}
#wires path.bus{stroke:var(--ink-3);opacity:.28;stroke-width:1;stroke-dasharray:1 7}

#wires path.halo{stroke:var(--bg);stroke-width:8;opacity:.62}
#wires path.hot{opacity:1;stroke-width:2.4;stroke-dasharray:8 7;animation:march .95s linear infinite}
#wires path.hot.is-live{stroke-width:3;filter:drop-shadow(0 0 8px currentColor)}
@keyframes march{to{stroke-dashoffset:-26}}
#dot{fill:var(--teal);filter:drop-shadow(0 0 8px var(--teal));opacity:0;transition:opacity .2s}

#stepbar{flex:none;margin:6px auto 10px;width:min(880px, calc(100% - 36px));
  background:color-mix(in srgb,var(--panel) 94%, transparent);border:1px solid var(--line);border-radius:15px;
  box-shadow:var(--shadow);padding:8px 13px;z-index:20}
#stepbar .top{display:flex;align-items:center;gap:9px;font-size:10.4px;color:var(--ink-3)}
#stepbar .top .who{color:var(--ink-2)}
#stepbar .top .n{font-family:var(--mono);font-size:10.4px;color:var(--ink-2)}
#stepbar .bar{display:flex;gap:4px;margin:6px 0 7px}
#stepbar .bar i{height:3px;flex:1;border-radius:2px;background:var(--line)}
#stepbar .bar i.done{background:color-mix(in srgb,var(--teal) 70%, var(--line))}
#stepbar .bar i.cur{background:var(--teal)}
#stepbar .txt{font-size:12px;line-height:1.4;min-height:29px}
#stepbar .txt b{font-weight:600}
#stepbar .txt span{display:block;font-size:10.9px;color:var(--ink-2);margin-top:2px}
#stepbar .ctl{display:flex;align-items:center;gap:6px;margin-top:6px}
#stepbar .ctl .sp{flex:1}
.sb{height:26px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);
  color:var(--ink-2);font-size:10.8px;display:inline-flex;align-items:center;gap:6px}
.sb:hover{color:var(--ink);border-color:color-mix(in srgb,var(--ink-2) 45%, transparent)}
.sb[disabled]{opacity:.32;cursor:default}
.sb.primary{background:color-mix(in srgb,var(--teal) 16%, var(--panel-2));border-color:color-mix(in srgb,var(--teal) 45%, transparent);color:var(--ink)}

#sheet{position:fixed;top:58px;right:0;bottom:0;width:392px;z-index:60;background:var(--panel);
  border-left:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(102%);
  transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
#sheet[data-open]{transform:none}
#sheet .sh{display:flex;align-items:flex-start;gap:10px;padding:15px 16px 11px;border-bottom:1px solid var(--line)}
#sheet .sh .tt{flex:1;font-size:14.6px;font-weight:650;letter-spacing:-.01em}
#sheet .sh .st{font-size:10.8px;color:var(--ink-2);margin-top:2px}
#sheet .x{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink-2)}
#sheet .sb2{padding:13px 16px 18px;overflow:auto;display:flex;flex-direction:column;gap:13px}
#sheet .row{display:flex;gap:6px;flex-wrap:wrap}
#sheet .tag{font-size:9.2px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);
  border:1px solid var(--line);border-radius:99px;padding:1px 7px}
#sheet .badge{font-size:9.2px;border-radius:99px;padding:1px 7px;color:var(--amber);
  border:1px solid color-mix(in srgb,var(--amber) 45%, transparent);background:color-mix(in srgb,var(--amber) 9%, transparent)}
#sheet h3{font-size:9.6px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);font-weight:550;margin-bottom:3px}
#sheet p{font-size:11.8px;color:var(--ink-2);line-height:1.5}
#sheet ul{list-style:none;display:flex;flex-direction:column;gap:4px}
#sheet li{font-size:11.8px;color:var(--ink-2);line-height:1.45;padding-left:12px;position:relative}
#sheet li::before{content:"";position:absolute;left:2px;top:7px;width:4px;height:4px;border-radius:50%;
  background:color-mix(in srgb,var(--ink-3) 70%, transparent)}
#sheet .src{font:10.2px/1.5 var(--mono);color:var(--ink-3);word-break:break-word}
#sheet .links{display:flex;flex-wrap:wrap;gap:6px}
#sheet .links button{font-size:10.2px;border:1px solid var(--line);border-radius:99px;padding:2px 8px;color:var(--ink-2)}
#sheet .links button:hover{color:var(--teal);border-color:color-mix(in srgb,var(--teal) 45%, transparent)}
#backdrop{position:fixed;inset:58px 0 0;z-index:55;background:rgba(4,8,12,.35);opacity:0;pointer-events:none;transition:opacity .25s}
#backdrop[data-open]{opacity:1;pointer-events:auto}

@media (max-width:1280px){ #rail{width:262px} #stepbar{width:min(760px, calc(100% - 24px))} }
@media (max-width:1240px){ #railBtn{display:inline-flex} }
@media (max-width:760px){
  header{gap:8px;padding:0 10px}
  .brand p{display:none}
  header .hbtn .lbl{display:none}
  header .hbtn{width:32px;padding:0;justify-content:center}
  #stepbar{width:calc(100vw - 16px);padding:7px 10px}
  #stepbar .ctl{flex-wrap:wrap}
  #stepbar .ctl .sp{display:none}
  .sb{padding:0 8px}
  #prev,#next{font-size:0}
  #prev::after{content:"←";font-size:14px}
  #next::after{content:"→";font-size:14px}
  #clear{display:none}
  #rail .foot{display:none}
}
@media (max-width:1240px){
  #rail{position:fixed;left:0;top:58px;bottom:0;z-index:35;width:276px;transform:translateX(-102%);
    transition:transform .25s;box-shadow:var(--shadow);background:var(--panel)}
  #rail[data-open]{transform:none}
}
@media (max-width:980px){
  body{overflow:auto}
  #app{display:block;height:auto;overflow:visible}
  #stage{margin-top:58px;height:auto;overflow:visible}
  #scroll{overflow:visible;padding:10px 0 0}
  #canvas{width:100%;min-height:0;padding:0 10px 150px}
  #wires{display:none}
  .zone{position:static;width:auto;margin:0 0 10px;overflow:visible}
  .zone.row>.zb{flex-wrap:wrap}
  .zone.row>.zb .node{flex:1 1 46%}
  #stepbar{position:sticky;bottom:8px;width:calc(100vw - 24px);margin:10px auto 12px;left:0;transform:none}
  #sheet{width:100%;top:58px}
  #backdrop{inset:58px 0 0}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
  #wires path.hot{stroke-dasharray:none}
  #dot{display:none}
}
</style>
</head>
<body data-theme="dark" data-truth="on">
<header>
  <div class="brand">
    <div class="mark" aria-hidden="true"><svg class="logo" viewBox="0 0 32 32" role="img" aria-label="Kybernos">
  <defs><linearGradient id="kbg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
    <stop stop-color="#4fe3c1"/><stop offset=".55" stop-color="#67b8ff"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs>
  <rect x="1" y="1" width="30" height="30" rx="9.5" fill="url(#kbg)"/>
  <path d="M11 8.4v15.2" stroke="#08151b" stroke-width="2.35" stroke-linecap="round"/>
  <path d="M13.7 15.55L21.2 8.4M13.7 16.45L21.2 23.6" stroke="#08151b" stroke-width="2.35" stroke-linecap="round"/>
  <circle cx="21.2" cy="16" r="1.75" fill="#08151b"/>
</svg></div>
    <div>
      <h1>Kybernos — la carte</h1>
      <p>Ce qui tourne chez toi, ce qui tourne sans toi, et ce qui sort.</p>
    </div>
  </div>
  <div class="spacer"></div>
  <button class="hbtn" id="railBtn" aria-label="Ouvrir les parcours"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span class="lbl">Parcours</span></button>

  <button class="hbtn" id="themeBtn" aria-label="Basculer clair / sombre">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
    <span class="lbl" id="themeLbl">Sombre</span>
  </button>
</header>

<div id="app">
  <aside id="rail" aria-label="Parcours et légende">
    <div class="rh" id="railH">8 parcours</div>
    <div class="list" id="scen"></div>
    <div class="legend">
      <b>Ce que la ligne veut dire</b>
      <div class="lg"><i style="border-color:var(--teal)"></i>reste sur ta machine</div>
      <div class="lg"><i style="border-color:var(--violet)"></i>parle à ton serveur (token)</div>
      <div class="lg"><i style="border-color:var(--blue)"></i>chiffré de bout en bout</div>
      <div class="lg"><i style="border-color:var(--amber)"></i>sort vers un fournisseur</div>
      <div class="lg"><i style="border-color:var(--rose)"></i>webhook entrant</div>
    </div>
    <div class="foot" id="railFoot"></div>
  </aside>

  <main id="stage">
    <div id="scroll">
      <div id="canvas">
        <svg id="wires" viewBox="0 0 1120 782" aria-hidden="true">
          <defs>
            <marker id="arw-local" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--teal)"/></marker>
            <marker id="arw-server" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--violet)"/></marker>
            <marker id="arw-e2e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--blue)"/></marker>
            <marker id="arw-ext" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--amber)"/></marker>
            <marker id="arw-hook" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="var(--rose)"/></marker>
          </defs>
          <g id="baseWires"></g><g id="busWires"></g><g id="haloWires"></g><g id="hotWires"></g><circle id="dot" r="4.5"></circle>
        </svg>
      </div>
    </div>
    <div id="stepbar" role="status" aria-live="polite">
      <div class="top"><span class="n" id="sbN">1 / 3</span><span class="who" id="sbWho"></span></div>

/* routage orthogonal : gouttière entre deux colonnes voisines, bus horizontal sinon */
let CANVAS_H = 782, BUS_Y = 640;
const COLS = { toi:0, serv:1, cloud:2, world:3 };
function zoneOf(id){ const n = NODES.find(x => x.id === id); return n ? n.zone : "toi"; }
function poly(pts, r){
  let d = `M ${pts[0][0]} ${pts[0][1]}`;
  for (let i = 1; i < pts.length; i++){
    const p0 = pts[i-1], p1 = pts[i], p2 = pts[i+1];
    if (!p2){ d += ` L ${p1[0]} ${p1[1]}`; continue; }
    const v1 = [p1[0]-p0[0], p1[1]-p0[1]], v2 = [p2[0]-p1[0], p2[1]-p1[1]];
    const n1 = Math.hypot(v1[0],v1[1]) || 1, n2 = Math.hypot(v2[0],v2[1]) || 1;
    const k = Math.min(r, n1/2, n2/2);
    const a = [p1[0]-v1[0]/n1*k, p1[1]-v1[1]/n1*k];
    const b = [p1[0]+v2[0]/n2*k, p1[1]+v2[1]/n2*k];
    d += ` L ${a[0]} ${a[1]} Q ${p1[0]} ${p1[1]} ${b[0]} ${b[1]}`;
  }
  return d;
}
const gutterRight = (c) => { const z = ZONES.find(z => COLS[z.id] === c); return z ? z.x + z.w + 7 : 0; };
function pathD(a, b){
  const A = rects.get(a), B = rects.get(b);
  if (!A || !B) return "";
  const cy = r => r.y + r.h/2, cx = r => r.x + r.w/2;
  if (a === b){ const x = A.x + A.w, y = cy(A); return `M ${x} ${y-6} C ${x+22} ${y-22}, ${x+25} ${y+22}, ${x+2} ${y+12}`; }
  const za = zoneOf(a), zb = zoneOf(b);
  const lowA = za === "world", lowB = zb === "world";
  if (lowA !== lowB){
    const strip = lowA ? A : B, col = lowA ? B : A, cz = lowA ? zb : za;
    const gx = gutterRight(COLS[cz]);
    if (lowA) return poly([[cx(strip), strip.y], [cx(strip), BUS_Y], [gx, BUS_Y], [gx, cy(col)], [col.x + col.w, cy(col)]], 9);
    return poly([[col.x + col.w, cy(col)], [gx, cy(col)], [gx, BUS_Y], [cx(strip), BUS_Y], [cx(strip), strip.y]], 9);
  }
  if (za === "world" && zb === "world"){ return poly([[A.x + A.w, cy(A)], [B.x, cy(B)]].length ? [[A.x + A.w, cy(A)], [(A.x+A.w+B.x)/2, cy(A)], [(A.x+A.w+B.x)/2, cy(B)], [B.x, cy(B)]] : [], 9); }
  const ca = COLS[za], cb = COLS[zb];
  if (ca === cb){
    const gap = B.y > A.y ? B.y - (A.y + A.h) : A.y - (B.y + B.h);
    if (gap < 26){ const x = cx(A), y1 = (B.y > A.y ? A.y + A.h : A.y), y2 = (B.y > A.y ? B.y : B.y + B.h); return `M ${x} ${y1} L ${x} ${y2}`; }
    const gx = gutterRight(ca);
    return poly([[A.x + A.w, cy(A)], [gx, cy(A)], [gx, cy(B)], [B.x + B.w, cy(B)]], 9);
  }
  if (Math.abs(ca - cb) === 1){
    const right = ca < cb;
    const gx = right ? (A.x + A.w + B.x) / 2 : (B.x + B.w + A.x) / 2;
    const p1 = [right ? A.x + A.w : A.x, cy(A)], p2 = [right ? B.x : B.x + B.w, cy(B)];
    return poly([[p1[0], p1[1]], [gx, p1[1]], [gx, p2[1]], [p2[0], p2[1]]], 9);
  }
  // colonnes non voisines : on passe par le bus
  const ga = gutterRight(ca), gb = gutterRight(cb);
  return poly([[A.x + A.w, cy(A)], [ga, cy(A)], [ga, BUS_Y], [gb, BUS_Y], [gb, cy(B)], [B.x + B.w, cy(B)]], 9);
}

/* deux passes : on laisse le texte décider de la hauteur des panneaux, puis on met à l'échelle */
function autoSize(){
  const cols = ZONES.filter(z => !z.row);
  for (const z of cols){ z.el.style.height = "auto"; }
  let maxH = 0;
  for (const z of cols) maxH = Math.max(maxH, z.el.getBoundingClientRect().height);
  maxH = Math.ceil(maxH);
  for (const z of cols) z.el.style.height = maxH + "px";
  const strip = ZONES.find(z => z.row);
  strip.el.style.height = "auto";
  const sh = Math.ceil(strip.el.getBoundingClientRect().height);
  const sy = 14 + maxH + 12;
  strip.el.style.top = sy + "px"; strip.el.style.height = sh + "px";
  CANVAS_H = sy + sh + 14;
  BUS_Y = sy - 6;
  canvas.style.height = CANVAS_H + "px";
  $("#wires").setAttribute("viewBox", `0 0 1120 ${CANVAS_H}`);
  $("#wires").style.height = CANVAS_H + "px";
}

function layout(){
  canvas.style.transform = "";
  if (window.innerWidth <= 980){
    for (const z of ZONES){ z.el.style.top = z.el.style.left = z.el.style.width = z.el.style.height = ""; }
    canvas.style.height = ""; $("#wires").style.height = "";
    return;
  }
  autoSize();
  const scroll = $("#scroll");
  let s = 1;
  if (window.innerWidth > 900){
    s = Math.min(1.12, (scroll.clientWidth - 12) / 1120, (scroll.clientHeight - 8) / CANVAS_H);
    s = Math.max(.86, s);
  }
  canvas.style.transform = s === 1 ? "" : `scale(${s})`;
  const cr = canvas.getBoundingClientRect();
  rects = new Map();
  for (const [id, n] of nodeEls){
    const r = n.getBoundingClientRect();
    rects.set(id, { x: (r.left - cr.left) / s, y: (r.top - cr.top) / s, w: r.width / s, h: r.height / s });
  }
  [...baseWires.children].forEach(p => p.setAttribute("d", pathD(p.dataset.a, p.dataset.b)));
  if (current.scen !== "all") drawHot();
}

/* ── parcours ──────────────────────────────────────────── */
function sc(){ return SCENARIOS.find(s => s.id === current.scen); }
function select(id, resetStep){
  current.scen = id;
  const n = Math.max(0, (SCENARIOS.find(s => s.id === id)?.steps.length || 1) - 1);
  current.step = resetStep ? 0 : Math.min(current.step, n);
  document.querySelectorAll(".pill").forEach(p => p.setAttribute("aria-current", p.dataset.id === id ? "true" : "false"));
  $("#app").dataset.scen = id === "all" ? "0" : "1";
  if (window.innerWidth <= 1240) $("#rail").removeAttribute("data-open");
  if (id === "all"){ paintAll(); renderStep(); return; }
  drawHot(); renderStep();
}

function drawHot(){
  hotWires.innerHTML = ""; haloWires.innerHTML = ""; busWires.innerHTML = ""; dotPath = null;
  const s = sc(); if (s.id === "all") return;
  const bus = document.createElementNS("http://www.w3.org/2000/svg","path");
  bus.setAttribute("class","bus"); bus.setAttribute("d", `M 6 ${BUS_Y} H 1114`);
  busWires.appendChild(bus);
  s.steps.forEach((step, i) => {
    const d = pathD(step.a, step.b);
    const halo = document.createElementNS("http://www.w3.org/2000/svg","path");
    halo.setAttribute("d", d); halo.setAttribute("class","halo"); haloWires.appendChild(halo);
    const p = document.createElementNS("http://www.w3.org/2000/svg","path");
    p.dataset.kind = step.kind; p.classList.add("hot"); p.setAttribute("d", d);
    p.setAttribute("marker-end", "url(#arw-" + step.kind + ")");
    if (i === current.step){ p.classList.add("is-live"); dotPath = p; }
    else { p.style.opacity = "0.42"; p.style.animation = "none"; p.style.strokeDasharray = "3 6"; }
    hotWires.appendChild(p);
    p.dataset.step = i;
  });
  startDot();
}

function paintNodes(){
  const s = sc();
  const used = new Set();
  s.steps.forEach(st => { used.add(st.a); used.add(st.b); });
  const st = s.steps[current.step] || {};
  for (const [id, n] of nodeEls){
    delete n.dataset.dim; delete n.dataset.on; delete n.dataset.live;
    if (s.id === "all") continue;
    if (!used.has(id)) n.dataset.dim = "1"; else n.dataset.on = "1";
    if (id === st.a || id === st.b) n.dataset.live = "1";
  }
}
function paintAll(){
  hotWires.innerHTML = ""; haloWires.innerHTML = ""; dot.style.opacity = "0";
  for (const n of nodeEls.values()){ delete n.dataset.dim; delete n.dataset.on; delete n.dataset.live; }
  document.querySelectorAll(".pill").forEach(p => p.setAttribute("aria-current", p.dataset.id === "all" ? "true" : "false"));
}

function renderStep(){
  const s = sc(), bar = $("#sbBar"), txt = $("#sbTxt");
  document.querySelectorAll("#scen .steps").forEach(box => {
    box.hidden = box.dataset.for !== s.id || s.id === "all";
    if (box.hidden) return;
    box.innerHTML = s.steps.map((st, i) =>
      `<button class="step" data-i="${i}" aria-current="${i === current.step}"><b>${i+1}.</b> ${st.t}</button>`).join("");
    box.querySelectorAll(".step").forEach(btn => btn.addEventListener("click", () => {
      stop(); current.step = +btn.dataset.i; drawHot(); renderStep();
    }));
  });
  if (s.id === "all"){
    $("#sbN").textContent = "vue d'ensemble";
    $("#sbWho").textContent = `${NODES.length} briques · ${SCENARIOS.length - 1} parcours`;
    bar.innerHTML = "<i class='cur' style='flex:1'></i>";
    txt.innerHTML = "<b>Choisis un parcours à gauche — ou clique une brique.</b><span>Chaque parcours allume son chemin ; les autres briques restent visibles, en retrait. Les lignes pointillées sont les liens qui existent tout le temps. La pastille orange dit « ce n'est pas construit comme ça », pas « ça marche ».</span>";
    $("#prev").disabled = $("#next").disabled = $("#play").disabled = true;
    requestAnimationFrame(layout);
    return;
  }
  const st = s.steps[current.step];
  $("#sbN").textContent = `${current.step+1} / ${s.steps.length}`;
  $("#sbWho").textContent = s.title;
  bar.innerHTML = s.steps.map((_, i) => `<i class="${i < current.step ? "done" : i === current.step ? "cur" : ""}"></i>`).join("");
  txt.innerHTML = `<b>${st.t}</b><span>${st.d}</span>`;
  $("#prev").disabled = current.step === 0;
  $("#next").disabled = current.step === s.steps.length - 1;
  $("#play").disabled = false;
  paintNodes();
  requestAnimationFrame(layout);
}

function next(){ const s = sc(); if (s.id === "all") return; if (current.step < s.steps.length - 1){ current.step++; drawHot(); renderStep(); } else stop(); }
function prev(){ if (current.step > 0){ current.step--; drawHot(); renderStep(); } }
function stop(){ if (playTimer){ clearInterval(playTimer); playTimer = null; } $("#play").textContent = "▶ Lecture"; }
function play(){
  if (playTimer){ stop(); return; }
  if (sc().id === "all") return;
  current.step = 0; drawHot(); renderStep();
  $("#play").textContent = "❚❚ Pause";
  playTimer = setInterval(() => {
    if (current.step >= sc().steps.length - 1){ stop(); return; }
    next();
  }, 3600);
}

function startDot(){
  if (rafDot) cancelAnimationFrame(rafDot);
  if (!dotPath || matchMedia("(prefers-reduced-motion: reduce)").matches){ dot.style.opacity = "0"; return; }
  dot.style.opacity = "1"; dotStart = performance.now();
  const len = dotPath.getTotalLength();
  const tick = (t) => {
    if (!dotPath){ dot.style.opacity = "0"; return; }
    const k = ((t - dotStart) % 2600) / 2600;
    if (dotPath.dataset.kind) dot.style.fill = `var(--${({local:"teal",server:"violet",e2e:"blue",ext:"amber",hook:"rose"})[dotPath.dataset.kind] || "teal"})`;
    const p = dotPath.getPointAtLength(k * len);
    dot.setAttribute("cx", p.x); dot.setAttribute("cy", p.y);
    rafDot = requestAnimationFrame(tick);
  };
  rafDot = requestAnimationFrame(tick);
}

/* ── fiche ─────────────────────────────────────────────── */
function openNode(id){
  const n = NODES.find(x => x.id === id); if (!n) return;
  $("#shT").textContent = n.t; $("#shS").textContent = n.s;
  const scs = SCENARIOS.filter(s => s.steps.some(st => st.a === id || st.b === id));
  $("#shB").innerHTML = `
    <div class="row"><span class="tag">${n.tag}</span>${n.badge ? `<span class="badge">${n.badge}</span>` : ""}</div>
    <div><h3>Rôle</h3><p>${n.role}</p></div>
    <div><h3>Ce qui la traverse</h3><ul>${n.cross.map(x => `<li>${x}</li>`).join("")}</ul></div>
    <div><h3>Ce qu'elle ne fait pas / limites</h3><ul>${n.limits.map(x => `<li>${x}</li>`).join("")}</ul></div>
    <div><h3>Où ça se règle</h3><p>${n.where}</p></div>
    <div><h3>Source</h3><div class="src">${n.source}</div></div>
    ${scs.length ? `<div><h3>Dans les parcours</h3><div class="links">${scs.map(s => `<button data-jump="${s.id}">${s.title}</button>`).join("")}</div></div>` : ""}`;
  $("#sheet").setAttribute("data-open",""); $("#sheet").setAttribute("aria-hidden","false");
  $("#backdrop").setAttribute("data-open","");
  $("#shB").querySelectorAll("[data-jump]").forEach(b => b.addEventListener("click", () => { closeSheet(); select(b.dataset.jump, true); }));
}
function closeSheet(){
  $("#sheet").removeAttribute("data-open"); $("#sheet").setAttribute("aria-hidden","true");
  $("#backdrop").removeAttribute("data-open");
}

/* ── contrôles ─────────────────────────────────────────── */
$("#next").addEventListener("click", next);
$("#prev").addEventListener("click", prev);
$("#play").addEventListener("click", play);
$("#clear").addEventListener("click", () => { stop(); select("all", true); });
$("#shX").addEventListener("click", closeSheet);
$("#backdrop").addEventListener("click", closeSheet);
$("#themeBtn").addEventListener("click", () => {
  const light = document.body.dataset.theme === "light";
  document.body.dataset.theme = light ? "dark" : "light";
  $("#themeLbl").textContent = light ? "Sombre" : "Clair";
  requestAnimationFrame(() => layout());
});

$("#railBtn").addEventListener("click", () => $("#rail").toggleAttribute("data-open"));
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape"){ closeSheet(); return; }
  if (e.key === "ArrowRight") next();
  if (e.key === "ArrowLeft") prev();
  if (e.key === " "){ e.preventDefault(); play(); }
  const n = Number(e.key);
  if (n >= 1 && n <= 8){ stop(); select(SCENARIOS[n].id, true); }
});
let rz;
window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(layout, 140); });

build();
select("s1", true);
</script>
</body>
</html>
