<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kybernos — the platform story</title>
<style>
:root{
  --bg:#f7f6f2; --panel:#ffffff; --panel-2:#f1efe8; --line:#d9d6cc; --line-2:#b9b6ab;
  --ink:#1f1e1b; --ink-2:#55534c; --ink-3:#77746a;
  --purple-bg:#eeedfe; --purple-line:#534ab7; --purple-ink:#3c3489;
  --gray-bg:#f1efe8; --gray-line:#888780; --gray-ink:#444441;
  --coral-bg:#faece7; --coral-line:#993c1d; --coral-ink:#712b13;
  --st-done:#0f6e56; --st-half:#854f0b; --st-todo:#77746a;
  --focus:#185fa5; --shadow:0 10px 30px rgba(31,30,27,.14);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16151a; --panel:#1f1e24; --panel-2:#26252c; --line:#36343d; --line-2:#4a4854;
    --ink:#ecebe6; --ink-2:#b5b3aa; --ink-3:#8c8a82;
    --purple-bg:#26215c; --purple-line:#7f77dd; --purple-ink:#cecbf6;
    --gray-bg:#2a2a28; --gray-line:#6a6963; --gray-ink:#d3d1c7;
    --coral-bg:#3a1f15; --coral-line:#d85a30; --coral-ink:#f5c4b3;
    --st-done:#5dcaa5; --st-half:#efae3c; --st-todo:#8c8a82;
    --focus:#85b7eb; --shadow:0 10px 30px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#16151a; --panel:#1f1e24; --panel-2:#26252c; --line:#36343d; --line-2:#4a4854;
  --ink:#ecebe6; --ink-2:#b5b3aa; --ink-3:#8c8a82;
  --purple-bg:#26215c; --purple-line:#7f77dd; --purple-ink:#cecbf6;
  --gray-bg:#2a2a28; --gray-line:#6a6963; --gray-ink:#d3d1c7;
  --coral-bg:#3a1f15; --coral-line:#d85a30; --coral-ink:#f5c4b3;
  --st-done:#5dcaa5; --st-half:#efae3c; --st-todo:#8c8a82;
  --focus:#85b7eb; --shadow:0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
code{font:12px var(--mono);color:var(--ink-2);word-break:break-word}

#top{position:sticky;top:0;z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;padding:10px 16px;max-width:1320px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand svg{width:26px;height:26px;display:block}
.brand h1{font-size:15px;font-weight:600;line-height:1.2}
.brand p{font-size:12px;color:var(--ink-3);line-height:1.2}
.search{flex:1;max-width:320px;margin-left:auto;display:flex;align-items:center;gap:7px;height:32px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink-3)}
.search svg{width:14px;height:14px;flex:none}
.search input{flex:1;min-width:0;background:none;border:0;color:var(--ink);font:inherit;outline:0}
.search:focus-within{border-color:var(--focus)}
.hbtn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);font-size:13px;white-space:nowrap;flex:none}
.hbtn:hover{color:var(--ink);border-color:var(--line-2)}
.hbtn[aria-pressed="true"]{color:var(--ink);border-color:var(--focus)}
.hbtn svg{width:15px;height:15px}
#filters{display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap;padding:6px 16px 10px;max-width:1320px;margin:0 auto}
#filters .hits .chip{font-size:12px;padding:2px 8px}
#filters .hits .none{font-size:12px;color:var(--ink-3)}
.fg{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-right:2px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:99px;border:1px solid var(--line);font-size:12.5px;color:var(--ink-2);background:var(--panel);white-space:nowrap;flex:none}
.chip:hover{color:var(--ink);border-color:var(--line-2)}
.chip[aria-pressed="false"]{opacity:.5;text-decoration:line-through}
.chip[data-chip-kaby][aria-pressed="false"]{opacity:1;text-decoration:none}
.chip[data-chip-kaby][aria-pressed="true"]{border-color:var(--coral-line);color:var(--coral-ink);background:var(--coral-bg)}
.chip .dot{width:9px;height:9px;border-radius:3px;border:1.5px solid var(--c);background:var(--b)}
.chip .n{font:11px var(--mono);color:var(--ink-3)}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;max-width:1320px;margin:0 auto;padding:16px}
#main{min-width:0}
#side{position:sticky;top:132px;align-self:start;max-height:calc(100vh - 150px);overflow:auto}
#story{border:1px solid var(--focus);background:var(--panel);border-radius:12px;padding:14px 16px;margin-bottom:12px}
body.story-on #sheet{display:none}
#story .sn{font:12px var(--mono);color:var(--ink-3)}
#story h2{font-size:17px;font-weight:600;margin:2px 0 6px}
#story p{color:var(--ink-2);max-width:68ch}
#story .sb{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
#story .dots{display:flex;gap:6px;margin:0 6px}
#story .dots i{width:8px;height:8px;border-radius:50%;background:var(--line-2)}
#story .dots i.on{background:var(--focus)}
.btn{display:inline-flex;align-items:center;height:30px;padding:0 13px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);font-size:13px;color:var(--ink)}
.btn:hover{border-color:var(--line-2)}
.btn[disabled]{opacity:.4;cursor:default}

#boardwrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px}
#board{display:block;width:100%;max-width:900px;margin:0 auto;height:auto}
.frame rect.fr{stroke-width:.75}
.frame.purple rect.fr{fill:var(--purple-bg);stroke:var(--purple-line)}
.frame.gray rect.fr{fill:var(--gray-bg);stroke:var(--gray-line)}
.frame.dash rect.fr{fill:none;stroke:var(--line-2);stroke-dasharray:6 4}
.frame.purple .ft,.frame.purple .fs,.frame.purple .fn{fill:var(--purple-ink)}
.frame.gray .ft,.frame.gray .fs,.frame.gray .fn{fill:var(--gray-ink)}
.frame.dash .ft,.frame.dash .fs,.frame.dash .fn{fill:var(--ink-2)}
.ft{font:600 14px var(--sans)} .fs{font:12px var(--sans);opacity:.85} .fn{font:12px var(--sans);opacity:.85} .fn.b{font-weight:600;opacity:1}
.frame.gray rect.bd{fill:none;stroke:var(--gray-line);stroke-width:.75;stroke-dasharray:1 0;opacity:.8}
.frame [data-frame]{cursor:pointer}
.eye{cursor:pointer;color:var(--ink-3)} .eye:hover{color:var(--ink)}
.eye .hitr{fill:transparent}
.eye path,.eye circle{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.node{cursor:pointer;transition:opacity .15s}
.node rect.nb{fill:var(--panel);stroke:var(--line-2);stroke-width:.75}
.node.dashed rect.nb{stroke-dasharray:4 3}
.node.kaby rect.nb{fill:var(--coral-bg);stroke:var(--coral-line)}
.node .nt{font:600 14px var(--sans);fill:var(--ink)}
.node .ns{font:12px var(--sans);fill:var(--ink-2)}
.node.kaby .nt{fill:var(--coral-ink)} .node.kaby .ns{fill:var(--coral-ink);opacity:.82}
.node.install rect.nb{fill:var(--purple-bg);stroke:var(--purple-line)}
.node.install .nt{fill:var(--purple-ink)} .node.install .ns{fill:var(--purple-ink);opacity:.82}
.node:hover rect.nb{stroke:var(--ink-2)}
.node.sel rect.nb{stroke:var(--focus);stroke-width:2}
.node:focus-visible{outline:none}
.node:focus-visible rect.nb{stroke:var(--focus);stroke-width:2}
.mk{stroke-width:1.5} .mk.done{fill:var(--st-done);stroke:var(--st-done)}
.mk.half{fill:var(--panel);stroke:var(--st-half)} .mk.todo{fill:var(--panel);stroke:var(--st-todo)}
.mkh{fill:var(--st-half)}
.lk{cursor:pointer;transition:opacity .15s}
.lk .hit{stroke:transparent;stroke-width:14;fill:none}
.lk .ln{fill:none;stroke:var(--ink-3);stroke-width:1.5}
.lk.dash .ln{stroke-dasharray:5 4}
.lk.dot .ln{stroke-dasharray:1.5 4.5;stroke-linecap:round}
.lk.kaby .ln{stroke:var(--coral-line)}
.lk .ll{font:12px var(--sans);fill:var(--ink-2)}
.lk.sel .ln{stroke-width:2.5}
.lk:focus-visible{outline:none} .lk:focus-visible .ln{stroke:var(--focus);stroke-width:2.5}
.dim{opacity:.22}

#list{display:flex;flex-direction:column;gap:12px}
.mframe{border:1px solid var(--line-2);border-radius:14px;padding:12px}
.mframe.purple{background:var(--purple-bg);border-color:var(--purple-line);color:var(--purple-ink)}
.mframe.gray{background:var(--gray-bg);border-color:var(--gray-line);color:var(--gray-ink)}
.mframe.dash{border-style:dashed;color:var(--ink-2)}
.mframe header{display:flex;align-items:flex-start;gap:8px}
.mframe h2{font-size:14.5px;font-weight:600;flex:1;line-height:1.3}
.mframe .msub,.mframe .mnote{font-size:12.5px;opacity:.9;margin-top:4px}
.mframe .mg{font-size:12px;letter-spacing:.04em;text-transform:uppercase;margin:12px 0 6px;opacity:.85}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.tile{position:relative;display:block;width:100%;border:1px solid var(--line-2);border-radius:10px;background:var(--panel);color:var(--ink);padding:9px 10px 9px 10px;min-height:54px}
.tile.dashed{border-style:dashed}
.tile.kaby{background:var(--coral-bg);border-color:var(--coral-line);color:var(--coral-ink)}
.tile.install{background:var(--purple-bg);border-color:var(--purple-line);color:var(--purple-ink)}
.tile .tt{display:block;font-weight:600;font-size:13.5px;line-height:1.25;padding-right:16px}
.tile .ts{display:block;font-size:12px;opacity:.85;line-height:1.3;margin-top:2px}
.tile .tm{position:absolute;top:8px;right:8px;font-size:12px}
.tile.sel{outline:2px solid var(--focus)}
.tm.done,.pill.done{color:var(--st-done)} .tm.half,.pill.half{color:var(--st-half)} .tm.todo,.pill.todo{color:var(--st-todo)}
.mlinks{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--panel)}
.mlinks h2{font-size:13px;font-weight:600;margin-bottom:6px}
.lrow{display:block;width:100%;padding:7px 0;border-top:1px solid var(--line);font-size:13px;color:var(--ink-2)}
.lrow:first-of-type{border-top:0}
.lrow b{color:var(--ink);font-weight:600}
.lrow.dim{opacity:.3}

.legend{display:flex;flex-wrap:wrap;gap:8px 20px;margin-top:10px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend svg{width:34px;height:14px;flex:none}
.legend .sw{width:14px;height:14px;border-radius:4px;border:1px solid var(--coral-line);background:var(--coral-bg)}

#sheet{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
#sheet h2{font-size:18px;font-weight:600;line-height:1.25;margin:4px 0 2px}
#sheet h3{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:16px 0 6px;font-weight:600}
#sheet p{color:var(--ink-2)} #sheet p.sub{color:var(--ink-3);margin-bottom:8px}
#sheet ul{list-style:none} #sheet li{padding:6px 0;border-top:1px solid var(--line);color:var(--ink-2)}
#sheet li:first-child{border-top:0}
#sheet li .it{color:var(--ink);font-weight:600}
#sheet li small{display:block;color:var(--ink-3);font-size:12px}
.sh-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.where{font-size:12px;color:var(--ink-3)}
.note{margin:10px 0 0;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink-2);font-size:13px}
.note.half{border-color:var(--st-half)} .note.todo{border-color:var(--st-todo)}
.jump{display:block;width:100%;padding:6px 0;border-top:1px solid var(--line);color:var(--ink-2)}
.jump:first-of-type{border-top:0} .jump:hover{color:var(--ink)} .jump b{color:var(--ink);font-weight:600}
.xbtn{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);display:none;align-items:center;justify-content:center;background:var(--panel-2)}
.counts{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0}
.counts span{display:inline-flex;gap:6px;align-items:center;font-weight:600}
.keys{font-size:12.5px;color:var(--ink-3);margin-top:12px}
kbd{font:11.5px var(--mono);border:1px solid var(--line-2);border-radius:5px;padding:0 5px;color:var(--ink-2);background:var(--panel-2)}

.pd{fill:var(--focus);stroke:var(--panel);stroke-width:1.5}
.tile .tp{position:absolute;top:9px;right:27px;font-size:9px;line-height:1;color:var(--focus)}
.when{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:99px;border:1px solid var(--focus);color:var(--focus);font-size:11.5px;font-weight:600;line-height:1;white-space:nowrap}
.when.now{background:var(--focus);color:var(--bg)} .when.later{border-style:dashed}
#sheet li .when{margin-left:8px;vertical-align:1px}
.priv{margin-top:14px;padding:2px 12px 8px;border-radius:10px;border:1px dashed var(--focus);background:var(--panel-2)}
#sheet .priv h3{margin-top:12px;color:var(--focus)}
#sheet .priv li{border-top-color:var(--line-2)}
#sheet small.privn{color:var(--focus)}
.privtag{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;border-radius:8px;border:1px dashed var(--focus);color:var(--focus);font-size:12.5px;font-weight:600;white-space:nowrap;flex:none}
.privtag svg{width:14px;height:14px}
#story p.privs{margin-top:8px;padding:6px 10px;border-radius:8px;border:1px dashed var(--focus);color:var(--ink)}

#tip{position:fixed;z-index:60;max-width:300px;pointer-events:none;background:var(--panel);color:var(--ink);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;box-shadow:var(--shadow);font-size:12.5px;line-height:1.4}
#tip b{font-weight:600} #tip .st{font-weight:600;margin-left:6px} #tip .when{margin-left:6px;height:18px;font-size:11px} #tip p{color:var(--ink-2);margin-top:3px} #tip p.pl{color:var(--focus)}
footer{max-width:1320px;margin:0 auto;padding:4px 16px 28px;font-size:12px;color:var(--ink-3)}

@media (max-width:1000px){
  .layout{grid-template-columns:minmax(0,1fr)}
  #side{position:static;max-height:none;overflow:visible}
  #sheet{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:68vh;overflow:auto;border-radius:14px 14px 0 0;z-index:40;box-shadow:var(--shadow);display:none;padding-top:44px}
  body.sheet-open #sheet{display:block}
  .xbtn{display:flex}
  body.sheet-open footer{padding-bottom:70vh}
  body.story-on #story{position:fixed;left:0;right:0;bottom:0;z-index:41;margin:0;border-radius:14px 14px 0 0;box-shadow:var(--shadow);max-height:50vh;overflow:auto}
  body.story-on footer{padding-bottom:50vh}
}
@media (max-width:640px){
  .brand p{display:none}
  .bar{flex-wrap:wrap;gap:8px}
  .search{order:5;max-width:none;flex-basis:100%;margin-left:0}
  .hbtn .lbl,.privtag .lbl{display:none}
  #filters{flex-wrap:nowrap;overflow-x:auto;gap:8px 16px;padding-bottom:8px}
  .fg{flex-wrap:nowrap}
}
@media (prefers-reduced-motion:reduce){.node,.lk{transition:none}}
</style>
</head>

  if (state.story !== null) {
    const st = RAW.STORY[state.story];
    return { nodes: st.nodes === "ahead" ? new Set(RAW.NODES.filter(ahead).map((n) => n.id)) : new Set(st.nodes), links: new Set(st.links) };
  }
  const h = state.hover || state.sel;
  if (h && h.type === "node") return neighbours(h.id);
  if (h && h.type === "link") {
    const l = linkById.get(h.id);
    return { nodes: new Set([l.a, l.b].filter((x) => byId.has(x))), links: new Set([l.id]) };
  }
  const q = state.q.trim().toLowerCase();
  const allSt = state.on.done && state.on.half && state.on.todo;
  const allWhen = state.whenOn.now && state.whenOn.next && state.whenOn.later;
  if (allSt && allWhen && !state.kaby && !q) return null;
  const nodes = new Set(RAW.NODES.filter((n) => state.on[n.st] && (allWhen || (n.when && state.whenOn[n.when])) && (!state.kaby || n.tag === "kaby") && (!q || textOf(n).includes(q))).map((n) => n.id));
  const links = new Set(RAW.LINKS.filter((l) => {
    if (state.kaby) return l.tag === "kaby";
    if (q) return false;
    const ends = [l.a, l.b].filter((x) => byId.has(x));
    return ends.every((x) => nodes.has(x));
  }).map((l) => l.id));
  return { nodes, links };
}
function paint () {
  const L = lit();
  for (const el of $$("[data-node]")) {
    const id = el.dataset.node;
    el.classList.toggle("dim", Boolean(L) && !L.nodes.has(id));
    el.classList.toggle("sel", Boolean(state.sel) && state.sel.type === "node" && state.sel.id === id);
  }
  for (const el of $$("[data-link]")) {
    const id = el.dataset.link;
    el.classList.toggle("dim", Boolean(L) && !L.links.has(id));
    el.classList.toggle("sel", Boolean(state.sel) && state.sel.type === "link" && state.sel.id === id);
  }
}

/* ── the sheet ── */
function li (i) {
  return "<li><span class=\"it\">" + (i.st ? '<span class="pill ' + i.st + '">' + SYM[i.st] + "</span> " : "") + esc(i.t) + "</span>" + (i.d ? "<small>" + esc(i.d) + "</small>" : "") + (i.src ? "<small><code>" + esc(i.src) + "</code></small>" : "") + "</li>";
}
function list (title, items) { return items && items.length ? "<h3>" + title + "</h3><ul>" + items.map((x) => "<li>" + esc(x) + "</li>").join("") + "</ul>" : ""; }
function stepsOf (nid) {
  return RAW.STORY.map((s, i) => ({ s, i })).filter(({ s }) => (s.nodes === "ahead" ? ahead(byId.get(nid)) : s.nodes.includes(nid)));
}
const whenPill = (w) => (w ? '<span class="when ' + w + '">' + WHEN[w] + "</span>" : "");
function planLi (n, it) {
  const p = privOf(n), q = p && p.planned && typeof p.planned === "object" && has(p.planned, it.id) ? p.planned[it.id] : null;
  return '<li><span class="it">' + esc(it.t) + whenPill(whenOfItem(n, it)) + "</span>" + (it.d ? "<small>" + esc(it.d) + "</small>" : "") + (q && q.note ? '<small class="privn">Private: ' + esc(q.note) + "</small>" : "") + "</li>";
}
function privBlock (n) {
  const p = privOf(n), notes = p && Array.isArray(p.notes) ? p.notes.filter((x) => x && x.t) : [];
  return notes.length ? '<div class="priv"><h3>Private overlay</h3><ul>' + notes.map((x) => '<li><span class="it">' + esc(x.t) + "</span>" + (x.d ? "<small>" + esc(x.d) + "</small>" : "") + "</li>").join("") + "</ul></div>" : "";
}
function sheetHome () {
  const c = (st) => RAW.NODES.filter((n) => n.st === st).length;
  return '<h2>How to read this</h2><p class="sub">Kybernos is an AI agent platform. This page tells how its bricks fit together, and how far each one is.</p>' +
    '<div class="counts"><span class="pill done">● ' + c("done") + " built</span><span class=\"pill half\">◐ " + c("half") + " partly built</span><span class=\"pill todo\">○ " + c("todo") + " not built</span></div>" +
    "<p>Hover a brick to see what it links to, click it for its sheet. <b>Tell the story</b> walks through the platform in " + RAW.STORY.length + " steps. The eye on a frame hides it.</p>" +
    '<p class="note">Built means merged into dev and exercised. It does not mean live in production.</p>' +
    "<p>A <b>blue dot</b> on a brick says that its sheet lists what is planned there." + (HAS_WHEN ? " <b>Now</b>, <b>Next</b> and <b>Later</b> come from the private overlay; the <b>When</b> chips keep one horizon." : "") + "</p>" +
    (PRIV && typeof PRIV.home === "string" ? '<div class="priv"><h3>Private overlay</h3><p>' + esc(PRIV.home) + "</p></div>" : "") +
    '<p class="keys"><kbd>/</kbd> search · <kbd>←</kbd> <kbd>→</kbd> story steps · <kbd>Esc</kbd> close</p>';
}
function sheetNode (n) {
  const f = frameById.get(n.frame);
  let h = '<div class="sh-head"><span class="pill ' + n.st + '">' + SYM[n.st] + " " + ST[n.st] + "</span>" + whenPill(n.when) + '<span class="where">' + esc(f.short) + "</span></div><h2>" + esc(n.t) + '</h2><p class="sub">' + esc(n.s) + (n.s2 ? " · " + esc(n.s2) : "") + "</p>";
  if (n.stNote) h += '<div class="note ' + n.st + '">' + esc(n.stNote) + "</div>";
  h += "<h3>What it is</h3><p>" + esc(n.role) + "</p>";
  if (n.inside && n.inside.length) h += "<h3>Inside</h3><ul>" + n.inside.map(li).join("") + "</ul>";
  if (n.planned && n.planned.length) h += "<h3>Planned</h3><ul>" + n.planned.map((it) => planLi(n, it)).join("") + "</ul>";
  h += list("What crosses it", n.cross) + list("Limits", n.limits);
  if (n.where) h += "<h3>Where it is set</h3><p>" + esc(n.where) + "</p>";
  h += "<h3>Source</h3><p><code>" + esc(n.source) + "</code></p>" + privBlock(n);
  const ls = RAW.LINKS.filter((l) => l.a === n.id || l.b === n.id);
  if (ls.length) h += "<h3>Linked to</h3>" + ls.map((l) => '<button class="jump" data-link="' + l.id + '"><b>' + esc(l.t) + "</b> · " + esc(endName(l.a === n.id ? l.b : l.a)) + "</button>").join("");
  const ss = stepsOf(n.id);
  if (ss.length) h += "<h3>In the story</h3>" + ss.map(({ s, i }) => '<button class="jump" data-step="' + i + '"><b>' + (i + 1) + ".</b> " + esc(s.title) + "</button>").join("");
  return h;
}
function sheetLink (l) {
  return '<div class="sh-head"><span class="where">' + esc(endName(l.a)) + (l.two ? " ↔ " : " → ") + esc(endName(l.b)) + "</span></div><h2>" + esc(l.t) + "</h2>" +
    (l.target ? '<div class="note todo">Not built: this is the target.</div>' : "") +
    "<h3>What it is</h3><p>" + esc(l.d) + "</p>" + list("What crosses it", l.cross) +
    '<h3>Ends</h3><button class="jump" data-node="' + (byId.has(l.a) ? l.a : "") + '"' + (byId.has(l.a) ? "" : " disabled") + ">" + esc(endName(l.a)) + '</button><button class="jump" data-node="' + (byId.has(l.b) ? l.b : "") + '"' + (byId.has(l.b) ? "" : " disabled") + ">" + esc(endName(l.b)) + "</button>";
}
function sheetFrame (f) {
  return '<div class="sh-head"><span class="where">Frame</span></div><h2>' + esc(f.title) + "</h2>" + "<h3>What it is</h3><p>" + esc(f.role) + "</p>" + list("Limits", f.limits) +
    (f.where ? "<h3>Where it is set</h3><p>" + esc(f.where) + "</p>" : "") + "<h3>Source</h3><p><code>" + esc(f.source) + "</code></p>" +
    "<h3>Holds</h3>" + RAW.NODES.filter((n) => n.frame === f.id).map((n) => '<button class="jump" data-node="' + n.id + '"><span class="pill ' + n.st + '">' + SYM[n.st] + "</span> <b>" + esc(n.t) + "</b> · " + esc(n.s) + "</button>").join("");
}
function renderSheet () {
  const s = state.sel;
  let h = '<button class="xbtn" data-act="close-sheet" aria-label="Close">×</button>';
  if (!s) h += sheetHome();
  else if (s.type === "node") h += sheetNode(byId.get(s.id));
  else if (s.type === "link") h += sheetLink(linkById.get(s.id));
  else h += sheetFrame(frameById.get(s.id));
  const el = $("#sheet");
  el.innerHTML = h;
  el.scrollTop = 0;
  document.body.classList.toggle("sheet-open", Boolean(s));
}
function select (type, id) {
  state.sel = type ? { type, id } : null;
  state.hover = null;
  renderSheet();
  paint();
  hideTip();
}

/* ── the story ── */
function renderStory () {
  const el = $("#story"), i = state.story;
  $("#storyBtn").setAttribute("aria-pressed", String(i !== null));
  document.body.classList.toggle("story-on", i !== null);
  if (i === null) { el.hidden = true; return; }
  const st = RAW.STORY[i];
  el.hidden = false;
  el.innerHTML = '<div class="sn">Step ' + (i + 1) + " of " + RAW.STORY.length + "</div><h2>" + esc(st.title) + "</h2><p>" + esc(st.text) + "</p>" + (PRIV && PRIV.story && typeof PRIV.story[st.id] === "string" ? '<p class="privs"><b>Private:</b> ' + esc(PRIV.story[st.id]) + "</p>" : "") + '<div class="sb"><button class="btn" data-act="prev"' + (i === 0 ? " disabled" : "") + '>← Back</button><span class="dots">' + RAW.STORY.map((_, k) => '<i class="' + (k === i ? "on" : "") + '"></i>').join("") + '</span><button class="btn" data-act="next">' + (i === RAW.STORY.length - 1 ? "Done" : "Next →") + '</button><button class="btn" data-act="story-off">Close</button></div>';
}
function story (i) {
  if (i !== null && (i < 0 || i >= RAW.STORY.length)) i = null;
  state.story = i;
  if (i !== null) { state.sel = null; renderSheet(); }
  renderStory();
  paint();
}

/* ── filters ── */
function renderFilters () {
  const c = (st) => RAW.NODES.filter((n) => n.st === st).length;
  const dot = { engine: "--purple-line;--purple-bg", server: "--gray-line;--gray-bg", outside: "--line-2;transparent" };
  let s = '<div class="fg"><span class="fl">Where</span>' + RAW.FRAMES.map((f) => {
    const [a, b] = dot[f.id].split(";");
    return '<button class="chip" data-chip-frame="' + f.id + '" aria-pressed="' + !state.hidden.has(f.id) + '"><i class="dot" style="--c:var(' + a + ");--b:" + (b.startsWith("--") ? "var(" + b + ")" : b) + '"></i>' + esc(f.short) + "</button>";
  }).join("") + "</div>";
  s += '<div class="fg"><span class="fl">How far</span>' + ["done", "half", "todo"].map((st) => '<button class="chip" data-chip-st="' + st + '" aria-pressed="' + state.on[st] + '"><span class="pill ' + st + '">' + SYM[st] + "</span> " + ST[st] + ' <span class="n">' + c(st) + "</span></button>").join("") + "</div>";
  if (HAS_WHEN) s += '<div class="fg"><span class="fl">When</span>' + WHEN_ORDER.map((w) => '<button class="chip" data-chip-when="' + w + '" aria-pressed="' + state.whenOn[w] + '">' + WHEN[w] + ' <span class="n">' + RAW.NODES.filter((n) => n.when === w).length + "</span></button>").join("") + "</div>";
  s += '<div class="fg"><span class="fl">Focus</span><button class="chip" data-chip-kaby aria-pressed="' + state.kaby + '">Kaby</button></div>';
  const q = state.q.trim().toLowerCase();
  if (q) {
    const hits = hitsFor(q);
    s += '<div class="fg hits"><span class="fl">Hits</span>' + (hits.length
      ? hits.map((n) => '<button class="chip" data-node="' + n.id + '">' + esc(n.t) + ' <span class="n">' + SYM[n.st] + "</span></button>").join("")
      : '<span class="none">no brick' + (PRIV ? "" : " (private notes need roadmap.private.js)") + "</span>") + "</div>";
  }
  $("#filters").innerHTML = s;
}
function toggleFrame (id, only) {
  if (only) { RAW.FRAMES.forEach((f) => (f.id === id ? state.hidden.delete(f.id) : state.hidden.add(f.id))); }
  else if (state.hidden.has(id)) state.hidden.delete(id);
  else if (state.hidden.size < RAW.FRAMES.length - 1) state.hidden.add(id);
  if (state.sel && state.sel.type === "node" && state.hidden.has(byId.get(state.sel.id).frame)) select(null);
  renderFilters();
  draw();
}

/* ── tooltip ── */
function tipFor (el) {
  if (el.dataset.node) { const n = byId.get(el.dataset.node); return "<b>" + esc(n.t) + '</b><span class="st pill ' + n.st + '">' + SYM[n.st] + " " + ST[n.st] + "</span>" + whenPill(n.when) + "<p>" + esc(n.tip) + "</p>" + (n.planned && n.planned.length ? '<p class="pl">Planned: ' + n.planned.map((i) => esc(i.t)).join(" · ") + "</p>" : ""); }
  if (el.dataset.link) { const l = linkById.get(el.dataset.link); return "<b>" + esc(l.t) + "</b><p>" + esc(l.d) + "</p>"; }
  if (el.dataset.frame && el.tagName.toLowerCase() === "text") { const f = frameById.get(el.dataset.frame); return "<b>" + esc(f.title) + "</b><p>Click for what it is.</p>"; }
  if (el.dataset.eye) return "Hide or show this frame";
  return "";
}
function showTip (el, x, y) {
  const t = $("#tip"), h = tipFor(el);
  if (!h) return hideTip();
  t.innerHTML = h; t.hidden = false;
  const w = t.offsetWidth, hh = t.offsetHeight;
  t.style.left = Math.max(8, Math.min(innerWidth - w - 8, x + 14)) + "px";
  t.style.top = Math.max(8, Math.min(innerHeight - hh - 8, y + 16)) + "px";
}
function hideTip () { $("#tip").hidden = true; }

/* ── events ── */
const target = (e) => (e.target.closest ? e.target.closest("[data-eye],[data-act],[data-node],[data-link],[data-frame],[data-step],[data-chip-frame],[data-chip-st],[data-chip-when],[data-chip-kaby]") : null);
document.addEventListener("click", (e) => {
  const el = target(e);
  if (!el) return;
  const d = el.dataset;
  if (d.eye) return toggleFrame(d.eye, false);
  if (d.act) return act(d.act);
  if (d.chipFrame) return toggleFrame(d.chipFrame, e.shiftKey);
  if (d.chipSt) { state.on[d.chipSt] = !state.on[d.chipSt]; if (!state.on.done && !state.on.half && !state.on.todo) state.on = { done: true, half: true, todo: true }; renderFilters(); return paint(); }
  if (d.chipWhen) {
    if (e.shiftKey) WHEN_ORDER.forEach((w) => { state.whenOn[w] = w === d.chipWhen; }); else state.whenOn[d.chipWhen] = !state.whenOn[d.chipWhen];
    if (!state.whenOn.now && !state.whenOn.next && !state.whenOn.later) state.whenOn = { now: true, next: true, later: true };
    renderFilters(); return paint();
  }
  if (Object.prototype.hasOwnProperty.call(d, "chipKaby")) { state.kaby = !state.kaby; renderFilters(); return paint(); }
  if (d.step !== undefined) return story(Number(d.step));
  if (d.node) { if (state.story !== null) story(null); return select("node", d.node); }
  if (d.link) { if (state.story !== null) story(null); return select("link", d.link); }
  if (d.frame) { if (state.story !== null) story(null); return select("frame", d.frame); }
});
function act (a) {
  if (a === "story") return story(state.story === null ? 0 : null);
  if (a === "story-off") return story(null);
  if (a === "prev") return story(state.story - 1);
  if (a === "next") return story(state.story + 1 >= RAW.STORY.length ? null : state.story + 1);
  if (a === "close-sheet") return select(null);
  if (a === "theme") return setTheme((document.documentElement.dataset.theme || (matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light")) === "dark" ? "light" : "dark");
}
function over (e) {
  const el = target(e);
  if (!el || el.dataset.act || el.dataset.chipFrame || el.dataset.chipSt || el.dataset.chipWhen || el.closest("#sheet")) return;
  if (el.dataset.node) state.hover = { type: "node", id: el.dataset.node };
  else if (el.dataset.link) state.hover = { type: "link", id: el.dataset.link };
  else state.hover = null;
  paint();
  showTip(el, e.clientX, e.clientY);
}
$("#boardwrap").addEventListener("pointerover", over);
$("#boardwrap").addEventListener("pointermove", (e) => { if (!$("#tip").hidden) { const el = target(e); if (el) showTip(el, e.clientX, e.clientY); } });
$("#boardwrap").addEventListener("pointerleave", () => { state.hover = null; paint(); hideTip(); });
$("#boardwrap").addEventListener("focusin", (e) => {
  const el = target(e);
  if (!el || !(el.dataset.node || el.dataset.link)) return;
  state.hover = el.dataset.node ? { type: "node", id: el.dataset.node } : { type: "link", id: el.dataset.link };
  paint();
  const r = el.getBoundingClientRect();
  showTip(el, r.left + r.width / 2, r.top + r.height);
});
$("#boardwrap").addEventListener("focusout", () => { state.hover = null; paint(); hideTip(); });
$("#boardwrap").addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const el = target(e);
  if (el && (el.dataset.node || el.dataset.link || el.dataset.eye)) { e.preventDefault(); el.dispatchEvent(new MouseEvent("click", { bubbles: true })); }
});
let lastHit = "";
function onQuery () {
  state.q = $("#q").value;
  renderFilters();
  paint();
  const q = state.q.trim().toLowerCase();
  const first = q ? hitsFor(q)[0] : null;
  const id = first ? first.id : "";
  if (id && id !== lastHit) { const el = $('#board [data-node="' + id + '"], #list [data-node="' + id + '"]'); if (el && el.scrollIntoView) el.scrollIntoView({ block: "center", behavior: "smooth" }); }
  lastHit = id;
}
$("#q").addEventListener("input", onQuery);
$("#q").addEventListener("search", onQuery);
document.addEventListener("keydown", (e) => {
  const typing = e.target === $("#q");
  if (e.key === "/" && !typing) { e.preventDefault(); $("#q").focus(); return; }
  if (e.key === "Escape") {
    if (typing && $("#q").value) { $("#q").value = ""; state.q = ""; renderFilters(); paint(); return; }
    if (state.story !== null) return story(null);
    if (state.sel) return select(null);
    return;
  }
  if (typing || state.story === null) return;
  if (e.key === "ArrowRight") { e.preventDefault(); act("next"); }
  if (e.key === "ArrowLeft") { e.preventDefault(); act("prev"); }
});

/* ── theme and start ── */
function setTheme (t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem("kb-story-theme", t); } catch (e) { /* private window: the page still works */ }
}
function legend () {
  const line = (dash, col) => '<svg viewBox="0 0 34 14" aria-hidden="true"><path d="M2 7h26" fill="none" stroke="' + col + '" stroke-width="1.5"' + (dash ? ' stroke-dasharray="' + dash + '"' : "") + '/><path d="M24 3l5 4-5 4" fill="none" stroke="' + col + '" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  return '<span><b class="pill done">●</b> built</span><span><b class="pill half">◐</b> partly built</span><span><b class="pill todo">○</b> not built</span>' +
    '<span><svg viewBox="0 0 34 14" aria-hidden="true"><rect x="1" y="1" width="32" height="12" rx="4" fill="none" stroke="var(--line-2)" stroke-dasharray="4 3"/></svg> dashed outline: not fully built</span>' +
    '<span><svg viewBox="0 0 34 14" aria-hidden="true"><circle cx="17" cy="7" r="3.5" class="pd"/></svg> blue dot: something is planned, see its sheet</span>' +
    '<span><i class="sw"></i> Kaby</span><span><i class="sw" style="border-color:var(--purple-line);background:var(--purple-bg)"></i> a Kybernos install</span><span>' + line("1.5 4.5", "var(--ink-3)") + " direct: the server is not in the path</span><span>" + line("5 4", "var(--coral-line)") + " target, not built</span>";
}
(function start () {
  try { const t = localStorage.getItem("kb-story-theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) { /* default */ }
  $("#legend").innerHTML = legend();
  $("#foot").textContent = "Read at " + RAW.asof + ". A reading of the repositories and their documents, not a measure of a running system." + (PRIV ? " Private overlay loaded" + (typeof PRIV.asof === "string" ? " (" + PRIV.asof + ")" : "") + ": do not publish this view." : "");
  $("#privTag").hidden = !PRIV;
  renderFilters();
  renderSheet();
  draw();
  matchMedia("(max-width:720px)").addEventListener("change", draw);
})();
</script>
</body>
</html>
