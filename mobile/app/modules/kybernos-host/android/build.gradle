// The native half of the Kybernos app on Android: embeds Node (fogtape build, jniLibs/) and the runtime payload (assets/), both staged by scripts/stage-native.mjs and never committed.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.kybernoshost'
version = '0.1.0'

android {
  namespace "expo.modules.kybernoshost"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    ndk { abiFilters 'arm64-v8a' }
    externalNativeBuild { cmake { arguments "-DANDROID_STL=c++_shared" } }
  }
  externalNativeBuild { cmake { path "CMakeLists.txt" } }
  lint { abortOnError false }
}
