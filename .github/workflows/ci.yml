name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repository guard
        run: node scripts/garde-depot.mjs
      - name: Syntax check (all bundle sources)
        run: |
          find . -path ./.git -prune -o \( -name '*.mjs' -o -name '*.js' \) -type f -not -path '*/vendor/*' -not -path '*/src/plugin.js' -not -name '*.min.js' -print0 | xargs -0 -n1 node --check
      # Every test prints a « SKIPPED: <what> — <why> » line for whatever it could not run here (no playwright, no jsdom, no python
      # livekit, no DSH engine…). The output of both loops is kept so the last step can list them: a skip is not a pass.
      - name: Repo-level tests (every scripts/test-*.mjs)
        run: |
          for t in scripts/test-*.mjs; do
            echo "== $t"
            node "$t" 2>&1 | tee -a "$RUNNER_TEMP/test-output.log"
            test "${PIPESTATUS[0]}" -eq 0 || exit 1
          done
      - name: Plugin tests (every packages/*/test*.mjs)
        run: |
          for t in packages/*/test*.mjs; do
            echo "== $t"
            (cd "$(dirname "$t")" && node "$(basename "$t")") 2>&1 | tee -a "$RUNNER_TEMP/test-output.log"
            test "${PIPESTATUS[0]}" -eq 0 || exit 1
          done
      - name: messaging tests (standalone daemon)
        run: cd packages/messaging && node --test test/*.test.mjs
      - name: gate tests (standalone sign-in gate)
        run: cd packages/kybernos-gate && node --test test/*.test.mjs
      - name: What this run did NOT cover
        if: always()
        run: |
          n=$(grep -c -e '^SKIPPED: ' -e 'SAUTÉE (pas verte)' "$RUNNER_TEMP/test-output.log" || true)
          echo "SKIPPED SUMMARY: $n part(s) of the tests above did not run on this machine (listed below; a green run does not cover them)"
          grep -h -e '^SKIPPED: ' -e 'SAUTÉE (pas verte)' "$RUNNER_TEMP/test-output.log" | sort | uniq -c || true
